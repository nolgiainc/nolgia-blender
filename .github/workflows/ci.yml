name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  extension:
    name: Build and validate the extension (Blender 4.2 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get Blender
        run: .github/get-blender.sh
      - name: Build and validate
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' blender_manifest.toml)
          out="$RUNNER_TEMP/dist/nolgia-blender-$version.zip"
          mkdir -p "$RUNNER_TEMP/dist"
          "$BLENDER" --command extension build --source-dir . --output-filepath "$out"
          "$BLENDER" --command extension validate "$out"
          # Only the extension goes in the zip: no tests, workflows, presets, tools or README.
          python3 - "$out" <<'PY'
          import sys, zipfile
          top = sorted({n.split("/")[0] for n in zipfile.ZipFile(sys.argv[1]).namelist()})
          print("zip holds:", top)
          assert top == ["LICENSE", "__init__.py", "approval.py", "blender_manifest.toml", "core", "ops.py", "runtime.py", "ui.py"], top
          PY
